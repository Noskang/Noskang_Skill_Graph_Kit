name: Python tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # One test rebuilds the demo sample workbooks and compares them byte for byte with the committed ones. A zip header
    # records the operating system that wrote it, and the samples were written on Windows, so the tests run there.
    # The 39 Unity EditMode tests need a Unity license and run locally (see README).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install openpyxl
        run: python -m pip install "openpyxl==3.1.5"
      - name: Python tests (66)
        working-directory: Packages/com.noskang.skillgraphkit/Tools~/python
        run: python -X utf8 -m unittest discover -s tests -t tests
